title: Positioning Liṅgāyatism
subtitle: Rebellions and the Boundaries of Religion in the History of Royal Mysore
authors:
  - simmons
abstract: This paper investigates the historical construction and political positioning of Liṅgāyat identity within the context of the Mysore court, emphasizing the influence of political expediency in shaping religious boundaries. Through an analysis of two key narratives about rebellion—one set in the seventeenth century and the other in the nineteenth—the paper explores how Vīraśaiva-Liṅgāyats navigated the shifting allegiances and socio-political structures of colonial Mysore. This study argues that Liṅgāyat identity was not solely a product of theological differentiation but was significantly shaped by external political forces. This analysis highlights the intricate relationship between religious identity, state power, and historical memory, offering insights into the broader mechanisms by which religious communities are situated within political frameworks.
