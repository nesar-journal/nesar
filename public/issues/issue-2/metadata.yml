abstract: "This is the second issue of NESAR, and the first that is not a special issue. This issue has two articles: Archana Venkatesan’s thoughtful experiments with translating the religious poetry recited in festivals in Tamil Nadu and interpreted by a long tradition of scholars, and Yigal Bronner’s recovery of a Sanskrit poem, a direct response to Kālidāsa’s masterpiece, by the renegade poetician Udbhaṭa."

