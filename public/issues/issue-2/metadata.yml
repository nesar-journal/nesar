abstract: "This is the second issue of NESAR, and the first that is not a special issue. This issue has three articles: Archana Venkatesan’s thoughtful experiments with translating the religious poetry recited in festivals in Tamil Nadu and interpreted by a long tradition of scholars, and Yigal Bronner’s recovery of a Sanskrit poem, a direct response to Kālidāsa’s masterpiece, by the renegade poetician Udbhaṭa. The third article is the first in NESAR’s series of translations. G. S. Gai undertook an important study of the earliest surviving inscription in Kannada, the so-called Halmidi inscription, that he published in Kannada in 1990. That article has been translated by Arjun Sharma for this issue of NESAR."

